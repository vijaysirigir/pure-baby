<style>
/* ============================== [COLORS] ============================== */
:root{
  color-scheme: light;
  --bg:#FAF6EE;
  --surface:#FFFFFF;
  --surface-2:#F3EBDD;
  --surface-3:#EFE6D6;
  --ink:#2C2B26;
  --ink-soft:#4A473F;
  --muted:#6F6A5E;
  --line:#E7DDCB;
  --line-strong:#D9CDB6;

  --sage:#7C8F6D;
  --sage-deep:#5B6B4D;
  --sage-ink:#414D37;
  --sage-soft:#E7EDE0;
  --sage-tint:#F0F3EA;

  --peach:#E2A484;
  --peach-deep:#CB8560;
  --peach-soft:#F7E6DA;
  --peach-tint:#FBF1E9;

  --star:#D6A24B;
  --success:#5C8A5A;
  --success-soft:#E7F0E6;
  --danger:#B15540;
  --danger-soft:#F6E5E0;

  --shadow-sm:0 1px 2px rgba(60,50,30,.06),0 1px 3px rgba(60,50,30,.05);
  --shadow-md:0 6px 18px -6px rgba(60,50,30,.16),0 2px 6px rgba(60,50,30,.06);
  --shadow-lg:0 24px 50px -18px rgba(50,40,20,.28);

  --radius:18px;
  --radius-sm:12px;
  --radius-lg:26px;
  --radius-pill:999px;

  --maxw:1200px;
  --gutter:20px;
  --header-h:66px;

  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#161511;
    --surface:#201E19;
    --surface-2:#262218;
    --surface-3:#2C2820;
    --ink:#F1EADC;
    --ink-soft:#DCD4C4;
    --muted:#A69E8D;
    --line:#332E24;
    --line-strong:#413A2C;

    --sage:#A2B491;
    --sage-deep:#B9C9A9;
    --sage-soft:#282E22;
    --sage-tint:#22271D;

    --peach:#E3A886;
    --peach-deep:#EDB89B;
    --peach-soft:#33281E;
    --peach-tint:#231C15;

    --star:#E0B25E;
    --success:#8CB889;
    --success-soft:#20291E;
    --danger:#DA8168;
    --danger-soft:#2E1E19;

    --line-strong:#413A2C;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 8px 22px -8px rgba(0,0,0,.55);
    --shadow-lg:0 26px 55px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#161511;
  --surface:#201E19;
  --surface-2:#262218;
  --surface-3:#2C2820;
  --ink:#F1EADC;
  --ink-soft:#DCD4C4;
  --muted:#A69E8D;
  --line:#332E24;
  --line-strong:#413A2C;
  --sage:#A2B491;
  --sage-deep:#B9C9A9;
  --sage-soft:#282E22;
  --sage-tint:#22271D;
  --peach:#E3A886;
  --peach-deep:#EDB89B;
  --peach-soft:#33281E;
  --peach-tint:#231C15;
  --star:#E0B25E;
  --success:#8CB889;
  --success-soft:#20291E;
  --danger:#DA8168;
  --danger-soft:#2E1E19;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 8px 22px -8px rgba(0,0,0,.55);
  --shadow-lg:0 26px 55px -20px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:500;letter-spacing:-.01em;text-wrap:balance;line-height:1.12}
p{margin:0}
::selection{background:var(--peach-soft);color:var(--ink)}
:focus-visible{outline:2.5px solid var(--sage-deep);outline-offset:2px;border-radius:6px}

/* scrollbars */
*::-webkit-scrollbar{height:8px;width:8px}
*::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter);width:100%}
.section{padding-block:clamp(40px,6vw,76px)}
.eyebrow{font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--sage-deep)}
.muted{color:var(--muted)}
.serif{font-family:var(--serif)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:var(--radius-pill);
  padding:12px 22px;font-size:14.5px;font-weight:600;line-height:1;transition:.18s ease;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--sage-deep);color:#fff}
.btn-primary:hover{background:var(--sage-ink);transform:translateY(-1px);box-shadow:var(--shadow-md)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{color:#17190f}}
:root[data-theme="dark"] .btn-primary{color:#17190f}
.btn-peach{background:var(--peach-deep);color:#fff}
.btn-peach:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-outline{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn-outline:hover{border-color:var(--sage-deep);color:var(--sage-deep);background:var(--sage-tint)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-wa{background:#25936B;color:#fff}
.btn-wa:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-block{width:100%}
.btn-lg{padding:15px 28px;font-size:15px}
.btn-sm{padding:9px 15px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* ---------- pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:var(--radius-pill);background:var(--sage-soft);color:var(--sage-deep)}
.badge-off{background:var(--peach-deep);color:#fff;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:var(--radius-pill);letter-spacing:.01em}
.badge-new{background:var(--sage-deep);color:#fff}
.badge-soft{background:var(--surface);border:1px solid var(--line);color:var(--muted)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}

/* ---------- product card ---------- */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;
  transition:.2s ease;position:relative}
.pcard:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:var(--line-strong)}
.pcard__media{position:relative;aspect-ratio:1/1;background:var(--surface-2);overflow:hidden}
.pcard__media img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.pcard:hover .pcard__media img{transform:scale(1.05)}
.pcard__flags{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.pcard__wish{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;opacity:0;transform:translateY(-4px);transition:.18s ease;color:var(--muted)}
.pcard:hover .pcard__wish{opacity:1;transform:none}
.pcard__wish.on,.pcard__wish:focus-visible{opacity:1;transform:none}
.pcard__wish.on{color:var(--peach-deep);border-color:var(--peach)}
.pcard__wish svg{width:18px;height:18px}
.pcard__body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.pcard__brand{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--sage-deep)}
.pcard__name{font-family:var(--serif);font-size:16px;line-height:1.22;color:var(--ink)}
.pcard__desc{font-size:12.5px;color:var(--muted);line-height:1.4}
.pcard__meta{font-size:11.5px;color:var(--muted)}
.pcard__price{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:4px}
.pcard__price .now{font-size:17px;font-weight:700;color:var(--ink)}
.pcard__price .was{font-size:13px;color:var(--muted);text-decoration:line-through}
.pcard__cartbtn{margin-top:10px}
.soldout-veil{position:absolute;inset:0;background:color-mix(in srgb,var(--surface) 62%,transparent);display:grid;place-items:center;z-index:2}
.soldout-veil span{background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:6px 14px;border-radius:99px;letter-spacing:.04em}

/* rating */
.rating{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.stars{display:inline-flex;color:var(--star)}
.stars svg{width:14px;height:14px}
.stars .empty{color:var(--line-strong)}

/* grids */
.pgrid{display:grid;gap:18px;grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.pgrid{grid-template-columns:repeat(2,1fr);gap:12px}}

/* ---------- announcement bar ---------- */
.annc{background:var(--sage-ink);color:#F3EFE4;font-size:12.5px;font-weight:500;text-align:center;
  padding:8px 40px calc(8px);position:relative;letter-spacing:.01em}
.annc .close{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:inherit;opacity:.7;padding:4px;line-height:0}
.annc .close:hover{opacity:1}

/* ---------- header ---------- */
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.header__row{display:flex;align-items:center;gap:18px;height:var(--header-h)}
.nav{display:flex;align-items:center;gap:4px;margin-left:8px}
.nav a{padding:9px 13px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink-soft);transition:.15s}
.nav a:hover{background:var(--sage-tint);color:var(--sage-deep)}
.nav a.active{color:var(--sage-deep)}
.header__actions{margin-left:auto;display:flex;align-items:center;gap:2px}
.iconbtn{position:relative;width:42px;height:42px;border-radius:12px;border:none;background:transparent;color:var(--ink);display:grid;place-items:center;transition:.15s}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:21px;height:21px}
.countdot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--peach-deep);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;font-family:var(--sans)}
.hamburger{display:none}
@media(max-width:860px){.nav{display:none}.hamburger{display:grid}}

/* logo */
.logo{display:inline-flex;align-items:center;gap:10px}
.logo__mark{width:38px;height:38px;flex:none}
.logo__text{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--ink);line-height:1}
.logo__text small{display:block;font-family:var(--sans);font-size:8.5px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--sage-deep);margin-top:3px}

/* ---------- search overlay ---------- */
.ovl{position:fixed;inset:0;z-index:90;background:rgba(28,24,16,.42);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start}
.search-panel{background:var(--surface);width:min(680px,94vw);margin-top:12vh;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;border:1px solid var(--line)}
.search-panel__top{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.search-panel__top input{flex:1;border:none;background:none;font-size:17px;outline:none}
.search-panel__body{max-height:52vh;overflow:auto;padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--ink-soft)}
.chip:hover{border-color:var(--sage-deep);color:var(--sage-deep);background:var(--sage-tint)}
.sresult{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:12px}
.sresult:hover{background:var(--surface-2)}
.sresult img{width:46px;height:46px;border-radius:9px;object-fit:cover;background:var(--surface-2)}

/* ---------- drawer (cart) ---------- */
.drawer{position:fixed;inset:0;z-index:95;display:flex;justify-content:flex-end}
.drawer__scrim{position:absolute;inset:0;background:rgba(28,24,16,.42);backdrop-filter:blur(2px)}
.drawer__panel{position:relative;width:min(420px,100vw);background:var(--surface);height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
  border-left:1px solid var(--line);animation:slideIn .28s ease}
@keyframes slideIn{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.drawer__head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer__body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.drawer__foot{border-top:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}

/* cart line */
.citem{display:grid;grid-template-columns:72px 1fr auto;gap:12px}
.citem img{width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--surface-2)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:99px;overflow:hidden}
.qty button{width:32px;height:32px;border:none;background:var(--surface);color:var(--ink);display:grid;place-items:center}
.qty button:hover{background:var(--surface-3)}
.qty span{min-width:30px;text-align:center;font-weight:600;font-size:14px}
.linkx{background:none;border:none;color:var(--muted);font-size:12.5px;padding:0;text-decoration:underline;text-underline-offset:2px}
.linkx:hover{color:var(--danger)}

/* free-ship progress */
.ship-prog{background:var(--sage-tint);border:1px solid var(--sage-soft);border-radius:14px;padding:12px 14px;font-size:12.5px}
.bar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--sage-deep));border-radius:99px;transition:width .4s ease}

/* summary rows */
.srow{display:flex;justify-content:space-between;font-size:14px}
.srow.total{font-size:17px;font-weight:700;padding-top:10px;border-top:1px solid var(--line);margin-top:4px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden}
.hero__grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding-block:clamp(30px,5vw,64px)}
.hero__eyebrow{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px}
.hero h1{font-size:clamp(2.3rem,4.6vw,3.7rem);line-height:1.04;letter-spacing:-.025em}
.hero p.lead{font-size:clamp(15px,1.4vw,17.5px);color:var(--ink-soft);max-width:46ch;margin-top:18px;line-height:1.6}
.hero__cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.hero__trust{display:flex;flex-wrap:wrap;gap:18px;margin-top:26px;font-size:12.5px;color:var(--muted)}
.hero__trust b{color:var(--ink);font-weight:600}
.hero__art{position:relative;border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:5/5.4;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.hero__art img{width:100%;height:100%;object-fit:cover}
.hero__float{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-md);padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:12.5px}
.hero__float svg{width:20px;height:20px;color:var(--sage-deep)}
@media(max-width:820px){.hero__grid{grid-template-columns:1fr;gap:26px}.hero__art{aspect-ratio:16/12;order:-1}}

/* ---------- category cards ---------- */
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:820px){.catgrid{grid-template-columns:1fr}}
.catcard{position:relative;border-radius:var(--radius-lg);overflow:hidden;min-height:260px;display:flex;align-items:flex-end;padding:22px;color:#fff;
  border:1px solid var(--line);isolation:isolate;transition:.22s ease}
.catcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.catcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.catcard::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(30,26,16,.72),rgba(30,26,16,.05) 62%);z-index:-1}
.catcard h3{font-size:26px;color:#fff}
.catcard p{font-size:13.5px;opacity:.92;margin-top:4px}
.catcard .go{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-weight:600;font-size:13.5px}
.catcard .go svg{width:16px;height:16px;transition:.2s}
.catcard:hover .go svg{transform:translateX(4px)}

/* ---------- trust ---------- */
.trustgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:820px){.trustgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.trustgrid{grid-template-columns:1fr}}
.trust{display:flex;gap:13px;align-items:flex-start;padding:18px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.trust__ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--sage-soft);color:var(--sage-deep);display:grid;place-items:center}
.trust__ic svg{width:22px;height:22px}
.trust h4{font-family:var(--serif);font-size:15.5px;margin-bottom:3px}
.trust p{font-size:12.5px;color:var(--muted);line-height:1.45}

/* section head */
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.shead h2{font-size:clamp(1.6rem,3vw,2.3rem)}
.shead p{color:var(--muted);font-size:14px;margin-top:6px;max-width:52ch}
.seeall{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--sage-deep);font-size:14px;white-space:nowrap}
.seeall svg{width:16px;height:16px;transition:.2s}
.seeall:hover svg{transform:translateX(3px)}

/* ---------- editorial band ---------- */
.band{background:var(--surface-2);border-block:1px solid var(--line)}
.band__grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
@media(max-width:760px){.band__grid{grid-template-columns:1fr;gap:24px}}
.quote{font-family:var(--serif);font-size:clamp(1.4rem,2.6vw,2rem);line-height:1.3;color:var(--ink)}

/* ---------- collection layout ---------- */
.col-layout{display:grid;grid-template-columns:250px 1fr;gap:30px;align-items:start}
@media(max-width:860px){.col-layout{grid-template-columns:1fr}}
.filter{position:sticky;top:calc(var(--header-h) + env(safe-area-inset-top,0px) + 14px)}
.fgroup{border-bottom:1px solid var(--line);padding:16px 0}
.fgroup:first-child{padding-top:0}
.fgroup h4{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:12px}
.fopt{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13.5px;color:var(--ink-soft);cursor:pointer}
.fopt input{accent-color:var(--sage-deep);width:16px;height:16px}
.fopt .n{margin-left:auto;color:var(--muted);font-size:12px}
.fopt:hover{color:var(--ink)}
.col-topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.sel{border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px;background:var(--surface);font-weight:500}
.filter-toggle{display:none}
@media(max-width:860px){
  .filter-toggle{display:inline-flex}

    <g transform='translate(160,70) scale(1.5)'>${shape(cat,acc)}</g>

  return svgURI(svg);
}

/* =============================== STORE (context) =============================== */
const Store = createContext(null);
const useStore = ()=>useContext(Store);
const lsGet=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

function StoreProvider({children}){
  const [route,setRoute]=useState({name:"home"});
  const [cart,setCart]=useState(()=>lsGet("pb_cart",[]));
  const [wish,setWish]=useState(()=>lsGet("pb_wish",[]));
  const [toasts,setToasts]=useState([]);
  const [drawer,setDrawer]=useState(false);
  const [search,setSearch]=useState(false);

  useEffect(()=>lsSet("pb_cart",cart),[cart]);
  useEffect(()=>lsSet("pb_wish",wish),[wish]);

  // hash sync (plain tokens only — sandbox allows letters/digits/.-_~)
  useEffect(()=>{
    const parse=()=>{
      const h=(location.hash||"").replace(/^#/,"");
      if(!h){setRoute({name:"home"});return;}
      if(h.startsWith("product-")){const p=byId(h.slice(8));if(p){setRoute({name:"product",id:p.id});return;}}
      if(h.startsWith("cat-")){setRoute({name:"category",slug:h.slice(4)});return;}
      const map={home:"home",shop:"shop",cart:"cart",checkout:"checkout",wishlist:"wishlist",about:"about",contact:"contact",faq:"faq",shipping:"shipping",returns:"returns",privacy:"privacy",terms:"terms",search:"search"};
      if(map[h]){setRoute({name:map[h]});return;}
      setRoute({name:"home"});
    };
    parse();
    window.addEventListener("hashchange",parse);
    return ()=>window.removeEventListener("hashchange",parse);
  },[]);

  const go=(r)=>{
    setRoute(r); setDrawer(false); setSearch(false);
    let hash="";
    if(r.name==="product")hash="product-"+r.id;
    else if(r.name==="category")hash="cat-"+r.slug;
    else if(r.name!=="home")hash=r.name;
    if(("#"+hash)!==location.hash){history.pushState(null,"","#"+hash);}
    window.scrollTo({top:0,behavior:"instant"in document.documentElement.style?"instant":"auto"});
  };

  const toast=(msg)=>{const id=Date.now()+Math.random();setToasts(t=>[...t,{id,msg}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2600);};

  const addToCart=(p,qty=1,variant=null)=>{
    const key=p.id+(variant?("|"+variant):"");
    setCart(c=>{
      const ex=c.find(x=>x.key===key);
      if(ex)return c.map(x=>x.key===key?{...x,qty:x.qty+qty}:x);
      return [...c,{key,id:p.id,qty,variant}];
    });
    toast(`${p.name} added to cart`);
  };
  const setQty=(key,qty)=>setCart(c=>qty<=0?c.filter(x=>x.key!==key):c.map(x=>x.key===key?{...x,qty}:x));
  const removeItem=(key)=>setCart(c=>c.filter(x=>x.key!==key));
  const clearCart=()=>setCart([]);
  const toggleWish=(id)=>{
    setWish(w=>{const has=w.includes(id);toast(has?"Removed from wishlist":"Saved to wishlist");return has?w.filter(x=>x!==id):[...w,id];});
  };

  const cartCount=cart.reduce((s,x)=>s+x.qty,0);
  const cartLines=cart.map(x=>({...x,product:byId(x.id)})).filter(x=>x.product);
  const subtotal=cartLines.reduce((s,x)=>s+x.product.price*x.qty,0);
  const savings=cartLines.reduce((s,x)=>s+Math.max(0,(x.product.mrp-x.product.price))*x.qty,0);
  const shipping = subtotal===0?0:(subtotal>=CONFIG.FREE_SHIPPING_THRESHOLD?0:CONFIG.SHIPPING_FLAT);
  const total=subtotal+shipping;

  const val={route,go,cart,cartLines,cartCount,subtotal,savings,shipping,total,addToCart,setQty,removeItem,clearCart,
    wish,toggleWish,toasts,toast,drawer,setDrawer,search,setSearch};
  return <Store.Provider value={val}>{children}</Store.Provider>;
}

/* =============================== SEARCH OVERLAY =============================== */
function SearchOverlay(){
  const {search,setSearch,go}=useStore();
  const [q,setQ]=useState("");
  const inp=useRef(null);
  useEffect(()=>{if(search){setQ("");setTimeout(()=>inp.current&&inp.current.focus(),50);}},[search]);
  if(!search)return null;
  const term=q.trim().toLowerCase();
  const results=term?PRODUCTS.filter(p=>(p.name+" "+p.brand+" "+catTitle(p.cat)+" "+(p.type||"")).toLowerCase().includes(term)).slice(0,6):[];
  const suggestions=["Diapers","Baby lotion","Baby food","Rash cream","Kendamil","Body wash"];
  const submit=()=>{if(term){setSearch(false);go({name:"search",q});sessionSet(q);}};
  return (
    <div className="ovl" onClick={()=>setSearch(false)}>
      <div className="search-panel" onClick={e=>e.stopPropagation()}>
        <div className="search-panel__top">
          <Icon n="search" style={{width:20,height:20,color:"var(--muted)"}}/>
          <input ref={inp} value={q} onChange={e=>setQ(e.target.value)} placeholder="What are you looking for?"
            onKeyDown={e=>{if(e.key==="Enter")submit();if(e.key==="Escape")setSearch(false);}}/>
          <button className="iconbtn" onClick={()=>setSearch(false)} aria-label="Close"><Icon n="close"/></button>
        </div>
        <div className="search-panel__body">
          {!term && <>
            <p className="eyebrow" style={{margin:"6px 4px 10px"}}>Popular searches</p>
            <div className="chips">{suggestions.map(s=><button key={s} className="chip" onClick={()=>setQ(s)}>{s}</button>)}</div>
            <p className="eyebrow" style={{margin:"18px 4px 10px"}}>Browse categories</p>
            <div className="chips">{CATEGORIES.map(c=><button key={c.slug} className="chip" onClick={()=>{setSearch(false);go({name:"category",slug:c.slug});}}>{c.title}</button>)}</div>
          </>}
          {term && results.length===0 && <p className="muted" style={{padding:"20px 8px"}}>No products match “{q}”. Try “diapers”, “lotion” or a brand name.</p>}
          {results.map(p=>(
            <div key={p.id} className="sresult" onClick={()=>{setSearch(false);go({name:"product",id:p.id});}} style={{cursor:"pointer"}}>
              <img src={p.images[0]} alt=""/>
              <div style={{flex:1}}><div style={{fontSize:11,color:"var(--sage-deep)",fontWeight:600,letterSpacing:".06em",textTransform:"uppercase"}}>{p.brand}</div>
                <div style={{fontFamily:"var(--serif)",fontSize:15}}>{p.name}</div></div>
              <div className="tnum" style={{fontWeight:700}}>{fmt(p.price)}</div>
            </div>
          ))}
          {term && results.length>0 && <button className="btn btn-outline btn-block" style={{marginTop:10}} onClick={submit}>See all results for “{q}”</button>}
        </div>
      </div>
    </div>
  );
}

const sessionSet=(q)=>{_lastSearch=q;try{sessionStorage.setItem("pb_q",q);}catch(e){}};
const sessionGet=()=>{try{return sessionStorage.getItem("pb_q")||_lastSearch;}catch(e){return _lastSearch;}};

/* =============================== COLLECTION (shop / category / search) =============================== */
function Collection({mode,slug,query}){
  const {go}=useStore();
  const [sort,setSort]=useState("featured");
  const [filters,setFilters]=useState({brand:[],age:[],type:[],size:[],inStock:false,price:null});
  const [showFilter,setShowFilter]=useState(false);
  useEffect(()=>{setFilters({brand:[],age:[],type:[],size:[],inStock:false,price:null});setSort("featured");},[mode,slug,query]);

  let pool = mode==="category"?PRODUCTS.filter(p=>p.cat===slug)
    : mode==="search"?PRODUCTS.filter(p=>{const t=(query||"").toLowerCase();return (p.name+" "+p.brand+" "+catTitle(p.cat)+" "+(p.type||"")+" "+(p.concern||"")).toLowerCase().includes(t);})
    : PRODUCTS;

  // facet values
  const facet=(key,get)=>[...new Set(pool.map(get).filter(Boolean))].sort();
  const brands=facet("brand",p=>p.brand);
  const ages=facet("age",p=>p.age);
  const types=facet("type",p=>p.type);
  const sizes=facet("size",p=>p.cat==="diapers"?p.dSize:null);
  const priceRanges=[["Under ₹1,000",0,1000],["₹1,000–2,500",1000,2500],["₹2,500–6,000",2500,6000],["₹6,000+",6000,1e9]];

  const passes=(p)=>{
    if(filters.brand.length&&!filters.brand.includes(p.brand))return false;
    if(filters.age.length&&!filters.age.includes(p.age))return false;
    if(filters.type.length&&!filters.type.includes(p.type))return false;
    if(filters.size.length&&!filters.size.includes(p.dSize))return false;
    if(filters.inStock&&!p.availability)return false;
    if(filters.price){const[,lo,hi]=filters.price;if(!(p.price>=lo&&p.price<hi))return false;}
    return true;
  };
  let items=pool.filter(passes);
  const sorters={
    featured:(a,b)=>(b.featured-a.featured)||(b.discount-a.discount),
    newest:(a,b)=>(b.isNew-a.isNew),
    "price-asc":(a,b)=>a.price-b.price,
    "price-desc":(a,b)=>b.price-a.price,
    discount:(a,b)=>b.discount-a.discount,
    rating:(a,b)=>(b.rating||0)-(a.rating||0),
  };
  items=[...items].sort(sorters[sort]);

  const toggle=(key,v)=>setFilters(f=>({...f,[key]:f[key].includes(v)?f[key].filter(x=>x!==v):[...f[key],v]}));
  const activeCount=filters.brand.length+filters.age.length+filters.type.length+filters.size.length+(filters.inStock?1:0)+(filters.price?1:0);
  const title=mode==="category"?catTitle(slug):mode==="search"?`Search: “${query}”`:"Shop All";
  const blurb=mode==="category"?(CATEGORIES.find(c=>c.slug===slug)||{}).tag
    :mode==="search"?`${items.length} result${items.length!==1?"s":""} for your search`:"Every Pure Baby essential in one place.";

  const FilterPanel=()=>(
    <aside className={"filter"+(showFilter?"":" closed")}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h3 style={{fontSize:18}}>Filters {activeCount>0&&<span className="pill" style={{marginLeft:6}}>{activeCount}</span>}</h3>
        <div style={{display:"flex",gap:8}}>
          {activeCount>0&&<button className="linkx" onClick={()=>setFilters({brand:[],age:[],type:[],size:[],inStock:false,price:null})}>Clear all</button>}
          <button className="iconbtn filter-toggle" onClick={()=>setShowFilter(false)} aria-label="Close filters"><Icon n="close"/></button>
        </div>
      </div>
      <FGroup title="Availability">
        <label className="fopt"><input type="checkbox" checked={filters.inStock} onChange={()=>setFilters(f=>({...f,inStock:!f.inStock}))}/>In stock only</label>
      </FGroup>
      <FGroup title="Price">
        {priceRanges.map(r=><label key={r[0]} className="fopt"><input type="radio" name="price" checked={filters.price&&filters.price[0]===r[0]}
          onChange={()=>setFilters(f=>({...f,price:r}))}/>{r[0]}</label>)}
        {filters.price&&<button className="linkx" onClick={()=>setFilters(f=>({...f,price:null}))} style={{marginTop:4}}>Reset price</button>}
      </FGroup>
      {brands.length>1&&<FGroup title="Brand">{brands.map(b=><Opt key={b} label={b} n={pool.filter(p=>p.brand===b).length} on={filters.brand.includes(b)} onClick={()=>toggle("brand",b)}/>)}</FGroup>}
      {sizes.length>0&&<FGroup title="Diaper size">{sizes.map(s=><Opt key={s} label={s} n={pool.filter(p=>p.dSize===s).length} on={filters.size.includes(s)} onClick={()=>toggle("size",s)}/>)}</FGroup>}
      {ages.length>1&&<FGroup title="Age">{ages.map(a=><Opt key={a} label={a} n={pool.filter(p=>p.age===a).length} on={filters.age.includes(a)} onClick={()=>toggle("age",a)}/>)}</FGroup>}
      {types.length>1&&<FGroup title="Product type">{types.map(t=><Opt key={t} label={t} n={pool.filter(p=>p.type===t).length} on={filters.type.includes(t)} onClick={()=>toggle("type",t)}/>)}</FGroup>}
      <div className="filter-toggle" style={{marginTop:16}}><button className="btn btn-primary btn-block" onClick={()=>setShowFilter(false)}>Show {items.length} products</button></div>
    </aside>
  );

  return (
    <div className="wrap section" style={{paddingBlock:34}}>
      <div className="breadcrumb">
        <a href="#" onClick={e=>{e.preventDefault();go({name:"home"});}}>Home</a><Icon n="right"/>
        <span>{title}</span>
      </div>
      <div style={{marginBottom:22}}>
        <h1 style={{fontSize:"clamp(1.8rem,3.4vw,2.6rem)"}}>{title}</h1>
        {blurb&&<p className="muted" style={{marginTop:6}}>{blurb}</p>}
      </div>

      {mode==="search"&&items.length===0
        ? <div className="empty"><Icon n="search"/><p>No products found. Try a different search, or browse a category.</p>
            <div className="chips" style={{justifyContent:"center",marginTop:16}}>{CATEGORIES.map(c=><button key={c.slug} className="chip" onClick={()=>go({name:"category",slug:c.slug})}>{c.title}</button>)}</div></div>
        : <div className="col-layout">
            <FilterPanel/>
            <div>
              <div className="col-topbar">
                <button className="btn btn-outline btn-sm filter-toggle" onClick={()=>setShowFilter(true)}><Icon n="filter"/>Filters{activeCount>0&&` (${activeCount})`}</button>
                <span className="muted" style={{fontSize:13}}>{items.length} product{items.length!==1?"s":""}</span>
                <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13}} className="muted">Sort
                  <select className="sel" value={sort} onChange={e=>setSort(e.target.value)}>
                    <option value="featured">Featured</option><option value="newest">Newest</option>
                    <option value="price-asc">Price — Low to High</option><option value="price-desc">Price — High to Low</option>
                    <option value="discount">Discount</option><option value="rating">Customer Rating</option>
                  </select>
                </label>
              </div>
              {items.length===0?<div className="empty"><Icon n="filter"/><p>No products match these filters.</p>
                <button className="btn btn-outline" style={{marginTop:12}} onClick={()=>setFilters({brand:[],age:[],type:[],size:[],inStock:false,price:null})}>Clear filters</button></div>
                :<ProductGrid items={items}/>}
            </div>
          </div>}
    </div>
  );
}
function FGroup({title,children}){return <div className="fgroup"><h4>{title}</h4>{children}</div>;}
function Opt({label,n,on,onClick}){return <label className="fopt"><input type="checkbox" checked={on} onChange={onClick}/>{label}<span className="n">{n}</span></label>;}

function Checkout(){
  const {cartLines,subtotal,shipping,total,savings,clearCart,go}=useStore();
  const [pay,setPay]=useState("upi");
  const [placed,setPlaced]=useState(null);
  const [form,setForm]=useState({name:"",mobile:"",email:"",address:"",apartment:"",city:"",state:"",pin:""});
  const [errors,setErrors]=useState({});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  if(placed)return <OrderConfirmed order={placed}/>;
  if(cartLines.length===0)return <div className="wrap section"><div className="empty"><Icon n="cart"/><p>Your cart is empty.</p>
    <button className="btn btn-primary" style={{marginTop:14}} onClick={()=>go({name:"shop"})}>Shop now</button></div></div>;
  const validate=()=>{
    const e={};
    if(!form.name.trim())e.name="Please enter your name";
    if(!/^\d{10}$/.test(form.mobile.replace(/\D/g,"")))e.mobile="Enter a valid 10-digit mobile";
    if(!/^\S+@\S+\.\S+$/.test(form.email))e.email="Enter a valid email";
    if(!form.address.trim())e.address="Please enter your address";
    if(!form.city.trim())e.city="Required";
    if(!form.state.trim())e.state="Required";
    if(!/^\d{6}$/.test(form.pin))e.pin="6-digit PIN";
    setErrors(e);return Object.keys(e).length===0;
  };
  const placeOrder=()=>{
    if(!validate()){document.querySelector(".field.err")&&document.querySelector(".field.err").scrollIntoView({behavior:"smooth",block:"center"});return;}
    const order={id:"PB"+Date.now().toString().slice(-8),total,pay,name:form.name,items:cartLines.length,email:form.email};
    clearCart();setPlaced(order);
  };
  const F=(k,label,props={})=>(
    <div className={"field"+(errors[k]?" err":"")}>
      <label htmlFor={"f-"+k}>{label}</label>
      <input id={"f-"+k} value={form[k]} onChange={e=>set(k,e.target.value)} {...props}/>
      {errors[k]&&<span className="msg">{errors[k]}</span>}
    </div>
  );
  return <div className="wrap section" style={{paddingBlock:34}}>
    <div className="breadcrumb"><a href="#" onClick={e=>{e.preventDefault();go({name:"cart"});}}>Cart</a><Icon n="right"/><span>Checkout</span></div>
    <h1 style={{fontSize:"2rem",marginBottom:8}}>Checkout</h1>
    <div className="notice sage" style={{marginBottom:22,maxWidth:640}}>This is a prototype checkout — <b>no real payment is processed</b> and no order is actually placed.</div>
    <div className="co-grid">
      <div>
        <div className="card" style={{padding:24,marginBottom:20}}>
          <h3 style={{fontSize:18,marginBottom:16}}>Contact & Delivery</h3>
          {F("name","Full Name")}
          <div className="grid2">{F("mobile","Mobile Number",{inputMode:"numeric",placeholder:"10-digit number"})}{F("email","Email",{type:"email"})}</div>
          {F("address","Address (House no., Street, Area)")}
          {F("apartment","Apartment / Landmark (optional)")}
          <div className="grid2">{F("city","City")}{F("state","State")}</div>
          <div className="grid2">{F("pin","PIN Code",{inputMode:"numeric",placeholder:"6-digit"})}<div/></div>
        </div>
        <div className="card" style={{padding:24}}>
          <h3 style={{fontSize:18,marginBottom:16}}>Payment Method</h3>
          <div className="pay">
            {[["upi","UPI","GPay · PhonePe · Paytm"],["card","Credit / Debit Card","Visa · Mastercard · RuPay"],
              ["netbanking","Net Banking","All major banks"],["cod","Cash on Delivery","Pay when it arrives"]].map(([v,l,b])=>(
              <label key={v} className={"payopt"+(pay===v?" on":"")}>
                <input type="radio" name="pay" checked={pay===v} onChange={()=>setPay(v)}/>
                <span style={{fontWeight:600}}>{l}</span><span className="badges">{b}</span>
              </label>
            ))}
          </div>
        </div>
      </div>
      <div className="card" style={{padding:22,position:"sticky",top:"calc(var(--header-h) + 16px)"}}>
        <h3 style={{fontSize:18,marginBottom:14}}>Your Order</h3>
        <div style={{display:"flex",flexDirection:"column",gap:12,maxHeight:280,overflow:"auto",marginBottom:14}}>
          {cartLines.map(l=><div key={l.key} style={{display:"flex",gap:10,alignItems:"center"}}>
            <img src={l.product.images[0]} alt="" style={{width:46,height:46,borderRadius:9,objectFit:"cover"}}/>
            <div style={{flex:1,fontSize:13}}><div style={{fontFamily:"var(--serif)",lineHeight:1.2}}>{l.product.name}</div>
              <span className="muted">Qty {l.qty}{l.variant?` · ${l.variant}`:""}</span></div>
            <span className="tnum" style={{fontWeight:600,fontSize:13}}>{fmt(l.product.price*l.qty)}</span>
          </div>)}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:9,borderTop:"1px solid var(--line)",paddingTop:14}}>
          <div className="srow"><span>Subtotal</span><span className="tnum">{fmt(subtotal)}</span></div>
          {savings>0&&<div className="srow" style={{color:"var(--success)"}}><span>You save</span><span className="tnum">−{fmt(savings)}</span></div>}
          <div className="srow"><span>Shipping</span><span className="tnum">{shipping===0?"Free":fmt(shipping)}</span></div>
          <div className="srow total"><span>Total</span><span className="tnum">{fmt(total)}</span></div>
        </div>
        <button className="btn btn-primary btn-block btn-lg" style={{marginTop:16}} onClick={placeOrder}>Place Order · {fmt(total)}</button>
        <p className="muted" style={{fontSize:11.5,textAlign:"center",marginTop:10}}>By placing this order you agree to Pure Baby's Terms. Prototype only.</p>
      </div>
    </div>
  </div>;
}

    terms:{t:"Terms & Conditions",b:<>
      <p>These terms would govern your use of the Pure Baby website and your purchases.</p>
      <h3>Products & pricing</h3><p>We aim to describe products accurately, but always check the physical pack for the latest ingredient, allergen and usage information. Prices and availability may change without notice.</p>
      <h3>Orders</h3><p>Placing an order is an offer to buy; we may accept or decline it. We may cancel and refund orders in cases of pricing errors or stock issues.</p>
      <h3>Health note</h3><p>Our product information is general and not medical advice. Consult a paediatrician or healthcare professional for guidance specific to your child.</p>
      <h3>Liability</h3><p>To the extent permitted by law, Pure Baby is not liable for indirect or incidental losses arising from use of the site.</p>
      <div className="notice" style={{marginTop:12}}>This is placeholder legal copy for a prototype and is not legal advice.</div></>},
  }[which];
  return <PageShell title={P.t}>{P.b}</PageShell>;
}

/* =============================== FOOTER =============================== */
function Footer(){
  const {go}=useStore();
  const [subd,setSubd]=useState(false);
  const L=(label,r)=><li><a href="#" onClick={e=>{e.preventDefault();go(r);}}>{label}</a></li>;
  return <footer className="footer">
    <div className="wrap footer__grid">
      <div>
        <div className="logo" style={{marginBottom:12}}>
          <svg className="logo__mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <circle cx="24" cy="24" r="23" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.35)" strokeWidth="1.2"/>
            <path d="M24 34c-6-3.4-10-6.8-10-11.4C14 19 16.4 17 19 17c2 0 3.7 1.1 5 3 1.3-1.9 3-3 5-3 2.6 0 5 2 5 5.6C34 27.2 30 30.6 24 34z" fill="var(--peach)"/>
            <circle cx="24" cy="15" r="3.4" fill="#fff"/></svg>
          <span className="logo__text" style={{color:"#fff"}}>Pure Baby<small style={{color:"var(--peach)"}}>{CONFIG.DOMAIN}</small></span>
        </div>
        <p style={{fontSize:13.5,color:"#C7C1B0",maxWidth:"34ch"}}>Gentle choices for little ones — carefully selected baby food, diapers and skin & bath care.</p>
        <div className="newsletter">
          <input placeholder="Your email for gentle updates" aria-label="Email"/>
          <button className="btn btn-peach btn-sm" onClick={()=>setSubd(true)}>{subd?"Thanks!":"Join"}</button>
        </div>
      </div>
      <div><h5>Shop</h5><ul>{L("Baby Food",{name:"category",slug:"baby-food"})}{L("Diapers",{name:"category",slug:"diapers"})}{L("Skin & Bath Care",{name:"category",slug:"skin-bath"})}{L("Shop All",{name:"shop"})}</ul></div>
      <div><h5>Customer Care</h5><ul>{L("Contact Us",{name:"contact"})}{L("FAQ",{name:"faq"})}{L("Shipping",{name:"shipping"})}{L("Returns & Refunds",{name:"returns"})}</ul></div>
      <div><h5>Company</h5><ul>{L("About Pure Baby",{name:"about"})}{L("Privacy Policy",{name:"privacy"})}{L("Terms & Conditions",{name:"terms"})}
        <li><a href={waLink(`Hi ${CONFIG.BRAND}!`)} target="_blank" rel="noopener">WhatsApp</a></li></ul></div>
    </div>
    <div className="wrap footer__bottom">
      <span>© 2026 Pure Baby. All rights reserved.</span>
      <span>Prototype · {CONFIG.DOMAIN} · illustrative catalogue data</span>
    </div>
  </footer>;
}

/* =============================== TOASTS + WA FAB =============================== */
function Toasts(){
  const {toasts}=useStore();
  return <div className="toasts">{toasts.map(t=><div key={t.id} className="toast"><Icon n="check"/>{t.msg}</div>)}</div>;
}
function WhatsAppFab(){
  const {route}=useStore();
  const msg = route.name==="product" ? `Hi ${CONFIG.BRAND}, I have a question about ${(byId(route.id)||{}).name||"a product"}.` : `Hi ${CONFIG.BRAND}, I'd like some help.`;
  return <a className="wa-fab" href={waLink(msg)} target="_blank" rel="noopener" aria-label="Chat with us on WhatsApp">
    <Icon n="wa"/><span className="lbl">Chat with us on WhatsApp</span></a>;
}

/* =============================== APP =============================== */
function Router(){
  const {route}=useStore();
  switch(route.name){
    case "home":return <Home/>;
    case "shop":return <Collection mode="shop"/>;
    case "category":return <Collection mode="category" slug={route.slug}/>;
    case "search":return <Collection mode="search" query={route.q||sessionGet()}/>;
    case "product":return <ProductPage id={route.id}/>;
    case "cart":return <CartPage/>;
    case "checkout":return <Checkout/>;
    case "wishlist":return <Wishlist/>;
    case "about":return <About/>;
    case "contact":return <Contact/>;
    case "faq":return <FAQ/>;
    case "shipping":return <Policy which="shipping"/>;
    case "returns":return <Policy which="returns"/>;
    case "privacy":return <Policy which="privacy"/>;
    case "terms":return <Policy which="terms"/>;
    default:return <Home/>;
  }
}
function App(){
  return <StoreProvider>
    <AnnouncementBar/>
    <Header/>
    <main><Router/></main>
    <Footer/>
    <MobileBottomNav/>
    <WhatsAppFab/>
    <SearchOverlay/>
    <CartDrawer/>
    <Toasts/>
  </StoreProvider>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
